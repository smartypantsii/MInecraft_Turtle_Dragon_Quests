# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment — https://projects.neoforged.net/neoforged/neoforge (1.21.1 / 21.1.x)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.259
# Must not be [21.1.259,) — that would match 21.2+/26.x if the Minecraft pin were loosened.
neo_version_range=[21.1.259,21.2)
loader_version_range=[1,)

## Mod Properties
mod_id=turtle_dragon_quests
mod_name=Turtle Dragon Quests
mod_license=LGPL-3.0-only
mod_version=0.1.0
mod_group_id=com.jbarnes.turtledragonquests
